<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Caruso Propiedades</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --pine-900:#0d3d33; --pine-800:#12483c; --pine-700:#175947; --pine-600:#1d6b55;
  --saffron-500:#f0a13a; --saffron-600:#b5711a; --saffron-100:#fbe8cd;
  --sidebar-fg:#f6f2e8; --sidebar-fg-muted:rgba(246,242,232,.68);

  --paper-0:#faf7f2; --paper-50:#f1ecdf; --surface:#ffffff; --surface-2:#fbf9f4;
  --border:#e4dcc9; --border-strong:#d3c8ac;
  --ink-900:#20261f; --ink-600:#5b6357; --ink-400:#8c9184;

  --ok-600:#2f8f5b; --ok-100:#e1f2e7;
  --warn-600:#a3690f; --warn-100:#f8ecd6;
  --danger-600:#c0392b; --danger-100:#fbe6e2;
  --info-600:#3b6fb4; --info-100:#e6eef8;
  --violet-600:#7d5bc7; --violet-100:#efe9fb;

  --shadow-1: 0 1px 2px rgba(20,30,20,.06), 0 1px 1px rgba(20,30,20,.04);
  --shadow-2: 0 12px 32px rgba(13,40,30,.18), 0 2px 8px rgba(13,40,30,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper-0:#141c19; --paper-50:#1a2420; --surface:#1a2420; --surface-2:#1e2b25;
    --border:#2c3a33; --border-strong:#3a4a41;
    --ink-900:#eef1ec; --ink-600:#aab3a9; --ink-400:#78827a;
    --ok-600:#54c185; --ok-100:rgba(84,193,133,.14);
    --warn-600:#dba24a; --warn-100:rgba(219,162,74,.14);
    --danger-600:#e2685a; --danger-100:rgba(226,104,90,.14);
    --info-600:#7ba0dd; --info-100:rgba(123,160,221,.14);
    --violet-600:#ac91e6; --violet-100:rgba(172,145,230,.14);
    --shadow-2: 0 12px 32px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --paper-0:#141c19; --paper-50:#1a2420; --surface:#1a2420; --surface-2:#1e2b25;
  --border:#2c3a33; --border-strong:#3a4a41;
  --ink-900:#eef1ec; --ink-600:#aab3a9; --ink-400:#78827a;
  --ok-600:#54c185; --ok-100:rgba(84,193,133,.14);
  --warn-600:#dba24a; --warn-100:rgba(219,162,74,.14);
  --danger-600:#e2685a; --danger-100:rgba(226,104,90,.14);
  --info-600:#7ba0dd; --info-100:rgba(123,160,221,.14);
  --violet-600:#ac91e6; --violet-100:rgba(172,145,230,.14);
  --shadow-2: 0 12px 32px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.3);
}

*{box-sizing:border-box;}
body{
  background:var(--paper-0); color:var(--ink-900);
  font-family:"Public Sans",-apple-system,"Segoe UI",sans-serif;
  font-size:14.5px; line-height:1.45;
}
h1,h2,h3,.brand-name{font-family:"Fraunces","Georgia",serif; text-wrap:balance;}
button,input{font-family:inherit; font-size:inherit;}
::selection{background:var(--saffron-100); color:var(--pine-900);}
a{color:inherit;}
.tnum{font-variant-numeric:tabular-nums;}

/* ---------- shell ---------- */
.shell{display:flex; min-height:100vh;}
.sidebar{
  width:238px; flex:none; background:var(--pine-900); color:var(--sidebar-fg);
  display:flex; flex-direction:column; position:fixed; inset:0 auto 0 0; z-index:40;
  transition:transform .22s ease;
}
.brand{display:flex; align-items:center; gap:10px; padding:20px 18px 16px;}
.brand-mark{
  width:38px; height:38px; border-radius:11px; background:var(--saffron-500);
  display:flex; align-items:center; justify-content:center; flex:none;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.15);
}
.brand-mark svg{width:22px; height:22px;}
.brand-logo{display:block; width:100%; max-width:170px; height:auto; border-radius:8px;}
.brand-text{line-height:1.1;}
.brand-name{font-size:19px; font-weight:700; letter-spacing:.3px;}
.brand-sub{font-size:10.5px; text-transform:uppercase; letter-spacing:2px; color:var(--sidebar-fg-muted); font-weight:600;}

.nav{padding:8px 12px; display:flex; flex-direction:column; gap:2px; overflow-y:auto; flex:1;}
.nav-label{font-size:10.5px; text-transform:uppercase; letter-spacing:1.6px; color:var(--sidebar-fg-muted); padding:14px 10px 6px;}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:9px 10px; border-radius:9px;
  color:var(--sidebar-fg-muted); text-decoration:none; cursor:pointer; border:none; background:none;
  width:100%; text-align:left; font-size:14px; font-weight:500;
}
.nav-item svg{width:18px; height:18px; flex:none;}
.nav-item:hover{background:var(--pine-800); color:var(--sidebar-fg);}
.nav-item.active{background:var(--pine-700); color:#fff;}
.nav-item.active::before{content:""; }
.nav-count{
  margin-left:auto; background:var(--saffron-500); color:#3a2405; font-weight:700;
  font-size:11px; padding:1px 7px; border-radius:99px; min-width:20px; text-align:center;
}
.sidebar-foot{padding:14px 18px 18px; border-top:1px solid rgba(255,255,255,.08);}
.proto-tag{font-size:11px; color:var(--sidebar-fg-muted); display:flex; align-items:center; gap:6px;}
.proto-dot{width:6px; height:6px; border-radius:50%; background:var(--saffron-500); flex:none;}

.overlay{position:fixed; inset:0; background:rgba(10,20,15,.45); z-index:35; opacity:0; pointer-events:none; transition:opacity .2s;}
body.sidebar-open .overlay{opacity:1; pointer-events:auto;}
body.sidebar-open .sidebar{transform:translateX(0);}

.main{margin-left:238px; flex:1; display:flex; flex-direction:column; min-width:0;}
.topbar{
  position:sticky; top:0; z-index:20; background:var(--paper-0); border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:14px; padding:12px 28px;
}
.hamburger{display:none; background:none; border:1px solid var(--border-strong); border-radius:8px; width:36px; height:36px; align-items:center; justify-content:center; color:var(--ink-900); flex:none;}
.hamburger svg{width:19px; height:19px;}
.icon-btn{background:none; border:1px solid var(--border-strong); border-radius:8px; width:36px; height:36px; display:flex; align-items:center; justify-content:center; color:var(--ink-900); flex:none; cursor:pointer;}
.icon-btn svg{width:17px; height:17px;}
.icon-btn:hover{border-color:var(--saffron-500);}
.search-wrap{position:relative; flex:1; max-width:460px;}
.search-input{
  width:100%; padding:9px 14px 9px 38px; border-radius:10px; border:1px solid var(--border-strong);
  background:var(--surface); color:var(--ink-900); outline:none;
}
.search-input:focus{border-color:var(--saffron-500); box-shadow:0 0 0 3px var(--saffron-100);}
.search-icon{position:absolute; left:12px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--ink-400); pointer-events:none;}
.search-results{
  position:absolute; top:calc(100% + 6px); left:0; right:0; background:var(--surface); border:1px solid var(--border);
  border-radius:12px; box-shadow:var(--shadow-2); max-height:360px; overflow-y:auto; z-index:30; display:none;
}
.search-results.show{display:block;}
.search-group-label{font-size:10.5px; text-transform:uppercase; letter-spacing:1.2px; color:var(--ink-400); padding:10px 14px 4px;}
.search-result{display:flex; flex-direction:column; gap:1px; padding:8px 14px; cursor:pointer; border-bottom:1px solid var(--border);}
.search-result:last-child{border-bottom:none;}
.search-result:hover{background:var(--paper-50);}
.search-result-title{font-weight:600; font-size:13.5px;}
.search-result-sub{font-size:12px; color:var(--ink-600);}
.search-empty{padding:16px 14px; font-size:13px; color:var(--ink-400);}
.topbar-right{margin-left:auto; display:flex; align-items:center; gap:10px; font-size:13px; color:var(--ink-600); flex:none;}
.today-pill{background:var(--paper-50); border:1px solid var(--border); border-radius:99px; padding:5px 12px; white-space:nowrap;}

.content{padding:26px 28px 60px; flex:1;}
.content-inner{max-width:1180px; margin:0 auto;}
.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap;}
.page-title{font-size:26px; font-weight:600; margin:0;}
.page-sub{color:var(--ink-600); font-size:13.5px; margin-top:3px;}

/* ---------- buttons / badges / chips ---------- */
.btn{
  display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:9px; border:1px solid var(--border-strong);
  background:var(--surface); color:var(--ink-900); cursor:pointer; font-weight:600; font-size:13.5px; white-space:nowrap;
}
.btn svg{width:15px; height:15px;}
.btn:hover{border-color:var(--saffron-500);}
.btn-primary{background:var(--saffron-500); border-color:var(--saffron-500); color:#3a2405;}
.btn-primary:hover{background:var(--saffron-600); border-color:var(--saffron-600); color:#fff;}
.btn-ghost{border-color:transparent; background:transparent;}
.btn-ghost:hover{background:var(--paper-50); border-color:var(--border);}
.btn-sm{padding:5px 10px; font-size:12.5px; border-radius:7px;}
.btn-block{width:100%; justify-content:center;}

.badge{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; padding:3px 10px; border-radius:99px; white-space:nowrap;}
.badge svg{width:11px; height:11px;}
.badge-ok{background:var(--ok-100); color:var(--ok-600);}
.badge-warn{background:var(--warn-100); color:var(--warn-600);}
.badge-danger{background:var(--danger-100); color:var(--danger-600);}
.badge-info{background:var(--info-100); color:var(--info-600);}
.badge-violet{background:var(--violet-100); color:var(--violet-600);}
.badge-neutral{background:var(--paper-50); color:var(--ink-600); border:1px solid var(--border);}

.pill-row{display:flex; gap:8px; flex-wrap:wrap;}
.pill{padding:6px 13px; border-radius:99px; border:1px solid var(--border-strong); background:var(--surface); font-size:13px; font-weight:600; cursor:pointer; color:var(--ink-600);}
.pill.active{background:var(--pine-900); border-color:var(--pine-900); color:#fff;}

/* ---------- cards / panels ---------- */
.card{background:var(--surface); border:1px solid var(--border); border-radius:14px;}
.card-pad{padding:18px 20px;}
.section-title{font-size:15px; font-weight:700; margin:0 0 2px;}
.grid-2{display:grid; grid-template-columns:1.4fr 1fr; gap:18px; align-items:start;}

.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:22px;}
.stat-tile{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 18px; display:flex; flex-direction:column; gap:6px;}
.stat-top{display:flex; align-items:center; justify-content:space-between;}
.stat-icon{width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex:none;}
.stat-icon svg{width:17px; height:17px;}
.stat-value{font-size:28px; font-weight:700; font-family:"Fraunces",serif;}
.stat-label{font-size:12.5px; color:var(--ink-600); font-weight:600;}

.task-list{display:flex; flex-direction:column;}
.task-row{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border);}
.task-row:last-child{border-bottom:none;}
.task-dot{width:9px; height:9px; border-radius:50%; flex:none;}
.task-text{flex:1; font-size:13.8px;}
.task-text b{font-weight:700;}
.task-sub{font-size:12px; color:var(--ink-600); margin-top:1px;}

.activity-row{display:flex; gap:11px; padding:10px 0; border-bottom:1px solid var(--border); font-size:13px;}
.activity-row:last-child{border-bottom:none;}
.activity-dot{width:7px; height:7px; border-radius:50%; background:var(--ok-600); margin-top:6px; flex:none;}
.activity-text{color:var(--ink-900);}
.activity-time{color:var(--ink-400); font-size:11.5px;}

/* ---------- tables ---------- */
.table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:14px; background:var(--surface);}
table{width:100%; border-collapse:collapse; font-size:13.6px;}
thead th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--ink-400); font-weight:700; padding:12px 16px; border-bottom:1px solid var(--border); white-space:nowrap;}
tbody td{padding:13px 16px; border-bottom:1px solid var(--border); vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr.clickable{cursor:pointer;}
tbody tr.clickable:hover{background:var(--paper-50);}
td.num, th.num{text-align:right;}
.cell-title{font-weight:600;}
.cell-sub{font-size:12px; color:var(--ink-600);}
.row-actions{display:flex; gap:6px; justify-content:flex-end;}

.empty-state{padding:48px 20px; text-align:center; color:var(--ink-600);}
.empty-state svg{width:34px; height:34px; color:var(--ink-400); margin-bottom:10px;}
.empty-state-title{font-weight:700; color:var(--ink-900); margin-bottom:3px;}

/* ---------- ficha / tabs ---------- */
.back-link{display:inline-flex; align-items:center; gap:6px; color:var(--ink-600); font-size:13px; font-weight:600; margin-bottom:14px; cursor:pointer; border:none; background:none; padding:0;}
.back-link svg{width:15px; height:15px;}
.back-link:hover{color:var(--ink-900);}
.ficha-head{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:6px; flex-wrap:wrap;}
.ficha-id{font-size:12px; color:var(--ink-400); font-weight:700; letter-spacing:.5px;}
.ficha-title{font-size:23px; font-weight:600; margin:2px 0 6px;}
.ficha-meta{display:flex; gap:8px; flex-wrap:wrap; align-items:center; color:var(--ink-600); font-size:13.5px;}
.tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); margin:20px 0 20px; overflow-x:auto;}
.tab-btn{padding:10px 6px; margin-right:18px; border:none; background:none; color:var(--ink-600); font-weight:600; font-size:13.8px; cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap;}
.tab-btn.active{color:var(--ink-900); border-bottom-color:var(--saffron-500);}

.kv-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px 24px;}
.kv{padding:2px 0;}
.kv-label{font-size:11.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-400); font-weight:700; margin-bottom:3px;}
.kv-value{font-size:14.5px; font-weight:600;}
.kv-value a{color:var(--info-600); text-decoration:none;}
.kv-value a:hover{text-decoration:underline;}
.divider{height:1px; background:var(--border); margin:18px 0;}

.chiprow{display:flex; gap:8px; flex-wrap:wrap;}
.svc-card{border:1px solid var(--border); border-radius:12px; padding:14px 16px; display:flex; flex-direction:column; gap:6px;}
.svc-name{font-weight:700; font-size:13.5px; display:flex; align-items:center; gap:8px;}
.svc-name svg{width:16px; height:16px; color:var(--ink-600);}
.svc-titular{font-size:12.5px; color:var(--ink-600);}
.svc-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}

/* ---------- drawer ---------- */
.drawer-overlay{position:fixed; inset:0; background:rgba(10,20,15,.4); z-index:60; opacity:0; pointer-events:none; transition:opacity .2s;}
.drawer-overlay.show{opacity:1; pointer-events:auto;}
.drawer{
  position:fixed; top:0; right:0; bottom:0; width:min(400px,92vw); background:var(--surface); z-index:61;
  box-shadow:var(--shadow-2); transform:translateX(100%); transition:transform .22s ease; padding:22px; overflow-y:auto;
}
.drawer-overlay.show .drawer{transform:translateX(0);}
.drawer-close{position:absolute; top:16px; right:16px; background:var(--paper-50); border:1px solid var(--border); border-radius:8px; width:30px; height:30px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-900);}
.drawer-close svg{width:15px; height:15px;}
.avatar{width:46px; height:46px; border-radius:12px; background:var(--pine-900); color:var(--saffron-500); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:17px; font-family:"Fraunces",serif;}

/* ---------- deudores ---------- */
.debtor-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:14px;}
.debtor-card{border:1px solid var(--border); border-radius:14px; padding:16px 18px; background:var(--surface); display:flex; flex-direction:column; gap:8px;}
.debtor-amount{font-size:22px; font-weight:700; font-family:"Fraunces",serif; color:var(--danger-600);}
.debtor-row{display:flex; justify-content:space-between; gap:8px;}

/* ---------- liquidaciones ---------- */
.liq-row{border-bottom:1px solid var(--border);}
.liq-row:last-child{border-bottom:none;}
.liq-head{display:flex; align-items:center; gap:14px; padding:15px 18px; cursor:pointer;}
.liq-head:hover{background:var(--paper-50);}
.liq-chevron{width:16px; height:16px; color:var(--ink-400); transition:transform .15s; flex:none;}
.liq-row.open .liq-chevron{transform:rotate(90deg);}
.liq-detail{display:none; padding:0 18px 18px 48px;}
.liq-row.open .liq-detail{display:block;}
.liq-line{display:flex; justify-content:space-between; padding:6px 0; font-size:13.5px; border-bottom:1px dashed var(--border);}
.liq-line:last-child{border-bottom:none; font-weight:700; padding-top:10px;}
.liq-total-badge{margin-left:auto; font-weight:700; font-family:"Fraunces",serif; font-size:16px;}

/* ---------- misc ---------- */
.note-banner{display:flex; gap:10px; align-items:flex-start; background:var(--warn-100); color:var(--warn-600); border-radius:10px; padding:12px 14px; font-size:13px; font-weight:600;}
.note-banner svg{width:17px; height:17px; flex:none; margin-top:1px;}
.note-banner.info{background:var(--info-100); color:var(--info-600);}
.toast{position:fixed; bottom:22px; left:50%; transform:translate(-50%,20px); background:var(--pine-900); color:#fff; padding:11px 18px; border-radius:10px; font-size:13.5px; font-weight:600; box-shadow:var(--shadow-2); opacity:0; transition:all .2s; z-index:80; display:flex; align-items:center; gap:8px;}
.toast.show{opacity:1; transform:translate(-50%,0);}
.toast svg{width:16px; height:16px; color:var(--saffron-500);}
.toast-undo{background:none; border:none; color:var(--saffron-500); font-weight:700; text-decoration:underline; cursor:pointer; padding:0; margin-left:4px; font-size:13.5px;}

.modal-overlay{position:fixed; inset:0; background:rgba(10,20,15,.45); z-index:70; opacity:0; pointer-events:none; transition:opacity .2s; display:flex; align-items:center; justify-content:center; padding:20px;}
.modal-overlay.show{opacity:1; pointer-events:auto;}
.modal-box{background:var(--surface); border-radius:14px; box-shadow:var(--shadow-2); padding:22px; width:min(440px,100%); max-height:90vh; overflow-y:auto; transform:translateY(10px); transition:transform .2s;}
.modal-box.wide{width:min(680px,100%);}
.modal-overlay.show .modal-box{transform:translateY(0);}

/* ---------- impresión ---------- */
#printArea{display:none;}
@media print {
  @page{ size:A4; margin:12mm; }
  body{ background:#fff !important; }
  body > *:not(#printArea){ display:none !important; }
  #printArea{ display:block !important; }
}
.doc{color:#111; background:#fff; font-family:"Public Sans",sans-serif; font-size:12.5px; line-height:1.4;}
.doc-page{break-after:page; page-break-after:always;}
.doc-page:last-child{break-after:auto; page-break-after:auto;}
.doc-head{display:flex; align-items:center; gap:14px; border-bottom:2px solid #111; padding-bottom:10px; margin-bottom:14px;}
.doc-logo{height:54px; width:auto; border-radius:4px; flex:none;}
.doc-org{line-height:1.35; font-size:11.5px;}
.doc-org b{font-size:15px;}
.doc-title{margin-left:auto; text-align:right;}
.doc-title h2{font-family:"Fraunces",serif; font-size:19px; margin:0;}
.doc-title div{font-size:11.5px; color:#444;}
.doc h3{font-size:11.5px; text-transform:uppercase; letter-spacing:.6px; margin:16px 0 6px; border-bottom:1px solid #999; padding-bottom:3px;}
.doc-kv{display:grid; grid-template-columns:repeat(2,1fr); gap:3px 22px;}
.doc-kv span{color:#555;}
.doc table{width:100%; border-collapse:collapse; font-size:11.5px;}
.doc thead th{border-bottom:1.5px solid #111; padding:5px 6px; text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.3px; color:#333;}
.doc tbody td{border-bottom:1px solid #ccc; padding:5px 6px; vertical-align:top;}
.doc .num{text-align:right; font-variant-numeric:tabular-nums;}
.doc tr.doc-total td{font-weight:800; font-size:13px; border-top:2px solid #111; border-bottom:none;}
.doc-warn{font-weight:700;}
.doc-sign{display:flex; justify-content:space-between; gap:50px; margin-top:56px;}
.doc-sign div{flex:1; border-top:1px solid #111; text-align:center; padding-top:4px; font-size:11px;}
.doc-foot{margin-top:18px; font-size:10px; color:#666; text-align:center;}
.receipt-cut{border-top:1px dashed #555; margin:22px 0; text-align:center; font-size:10px; color:#666; line-height:0;}
.receipt-cut span{background:#fff; padding:0 8px;}

/* ---------- recibo formal ---------- */
.receipt-box{display:flex; border:2px solid #1a1a1a; background:#fff; color:#1a1a1a; font-family:"Public Sans",sans-serif;}
.receipt-side{
  writing-mode:vertical-rl; transform:rotate(180deg); border-right:2px solid #1a1a1a;
  padding:14px 8px; font-weight:800; letter-spacing:3px; font-size:14px; white-space:nowrap;
  display:flex; align-items:center; justify-content:center; flex:none;
}
.receipt-body{flex:1; padding:14px 18px;}
.receipt-row{display:flex; align-items:baseline; gap:8px; border-bottom:1px solid #1a1a1a; padding:7px 0; font-size:13px;}
.receipt-row .rl{font-weight:700; white-space:nowrap; flex:none;}
.receipt-row .rv{flex:1; text-align:left;}
.receipt-breakdown{display:flex; gap:18px; padding:12px 0 6px; font-size:12.5px;}
.receipt-breakdown > div{flex:1; text-align:center; border:1px solid #1a1a1a; border-radius:6px; padding:8px;}
.receipt-breakdown .kv-label{color:#444;}
.receipt-breakdown .tnum{font-weight:700; font-size:14px; margin-top:2px;}
.receipt-sign{text-align:right; margin-top:24px; font-size:13px;}
.receipt-head{display:flex; align-items:center; gap:12px; padding-bottom:8px; border-bottom:2px solid #1a1a1a;}
.receipt-head img{height:44px; width:auto; border-radius:4px; flex:none;}
.receipt-org{font-size:11px; line-height:1.35;}
.receipt-org b{font-size:14px;}
.receipt-copy{margin-left:auto; font-weight:800; font-size:10.5px; letter-spacing:2px; border:1.5px solid #1a1a1a; padding:3px 8px; border-radius:4px;}

.form-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
.field{display:flex; flex-direction:column; gap:5px;}
.field label{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--ink-400);}
.field input,.field select{padding:9px 12px; border:1px solid var(--border-strong); border-radius:9px; background:var(--paper-50); color:var(--ink-900);}
.staff-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--border);}
.staff-row:last-child{border-bottom:none;}

@media (max-width:860px){
  .sidebar{transform:translateX(-100%);}
  .main{margin-left:0;}
  .hamburger{display:flex;}
  .content{padding:18px 16px 50px;}
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .grid-2{grid-template-columns:1fr;}
  .kv-grid{grid-template-columns:1fr;}
  .svc-grid{grid-template-columns:repeat(2,1fr);}
  .form-grid{grid-template-columns:1fr;}
  .today-pill{display:none;}
}
</style>

function computeDebtors(){
  const overdue = payments.filter(p=>p.estado==='Vencido');
  const byContract = {};
  overdue.forEach(p=>{
    (byContract[p.contractId] ||= []).push(p);
  });
  return Object.entries(byContract).map(([cid, pays])=>{
    const c = CT(cid); const prop = PR(c.propertyId); const tenant = P(c.tenantId);
    const total = pays.reduce((s,p)=>s+pagoTotal(p),0);
    const oldest = pays.reduce((a,b)=> a.vencimiento < b.vencimiento ? a : b);
    const dias = Math.round((HOY - new Date(oldest.vencimiento+'T00:00:00'))/86400000);
    return {contractId:cid, property:prop, tenant, periodos:pays.length, total, dias};
  }).sort((a,b)=>b.total-a.total);
}

function liquidacionOwner(ownerId, periodo){
  const cs = contractsByOwner(ownerId);
  let cobrado=0, detalle=[];
  cs.forEach(c=>{
    const pay = payments.find(p=>p.contractId===c.id && p.periodo===periodo);
    if(!pay) return;
    const bruto = pay.estado==='Pagado' ? pagoTotal(pay) : (pay.estado==='Parcial' ? (pay.pagado||0) : 0);
    const monto = Math.max(0, bruto - (bruto>0 ? noLiquida(pay) : 0));
    if(monto>0){ cobrado += monto; detalle.push({contract:c, property:PR(c.propertyId), tenant:P(c.tenantId), monto, honorarios:calcHonorarios(c, monto)}); }
  });
  const ownerPropertyIds = properties.filter(pr=>pr.ownerId===ownerId).map(pr=>pr.id);
  const gastosArreglos = repairs.filter(r=> ownerPropertyIds.includes(r.propertyId) && r.pagadoPor==='Propietario' && r.costo &&
      ((r.estado==='Arreglado' && periodo===PERIODO_ACTUAL) || (r.estado==='Pagado' && r.fechaPagado && r.fechaPagado.slice(0,7)===periodo)))
    .map(r=>({desc:`Arreglo — ${r.descripcion} (${PR(r.propertyId).direccion})`, monto:r.costo||0}));
  const gastosServicios = serviciosPagados.filter(s=> ownerPropertyIds.includes(s.propertyId) && s.fecha.slice(0,7)===periodo)
    .map(s=>({desc:`Servicio — ${s.servicio} (${PR(s.propertyId).direccion})`, monto:s.monto}));
  const gastos = [...gastosArreglos, ...gastosServicios];
  const gastosTotal = gastos.reduce((s,g)=>s+g.monto,0);
  const comision = detalle.reduce((s,d)=>s+d.honorarios,0);
  const total = cobrado - comision - gastosTotal;
  return {ownerId, owner:P(ownerId), detalle, cobrado, comision, gastos, gastosTotal, total};
}

      </tbody></table></div>`;

          ${r.documentos.length?`<div class="chiprow" style="margin-top:10px;">${r.documentos.map(d=>`<span class="badge badge-neutral" style="cursor:pointer;" onclick="showToast('Vista previa de documentos — próximamente')">${icon('doc')}${esc(d.nombre)}</span>`).join('')}</div>`:''}
          <div style="display:flex; gap:8px; margin-top:12px;">${arregloAcciones(r)}</div>
        </div>`).join('');
    }
  } else if(tab==='documentos'){
    body = `<div class="empty-state">${icon('doc')}<div class="empty-state-title">Gestor documental — próxima etapa</div><div>Acá vas a poder ver y subir el contrato, recibos y liquidaciones en PDF de esta propiedad.</div></div>`;
  }

  return `
    <button class="back-link" data-nav="/propiedades">${icon('back')}Volver a propiedades</button>
    <div class="ficha-head">
      <div>
        <div class="ficha-id">PROPIEDAD #${p.id}</div>
        <div class="ficha-title">${esc(p.tipo)} — ${esc(p.direccion)}</div>

}

function viewContratos(filter, query){
  filter = filter || 'activos';
  let list = contracts.slice();
  if(filter==='activos') list = list.filter(c=>c.estado==='Activo'||c.estado==='Próximo a vencer');
  else if(filter==='vencer') list = list.filter(c=>c.estado==='Próximo a vencer');
  else if(filter==='finalizados') list = list.filter(c=>c.estado==='Finalizado'||c.estado==='Rescindido'||c.estado==='Suspendido');
  else if(filter==='pendiente') list = list.filter(pendienteActualizacion);
  if(query){
    const q = query.toLowerCase();
    list = list.filter(c=>{
      const p = PR(c.propertyId); const t = P(c.tenantId); const o = P(c.ownerId);
      return (numeroContrato(c)+' '+p.direccion+' '+p.localidad+' '+nombreCompleto(t)+' '+nombreCompleto(o)).toLowerCase().includes(q);
    });
  }
  const filters = [['activos','Activos'],['vencer','Por vencer'],['pendiente','Actualización pendiente'],['finalizados','Finalizados']];
  const rows = list.map(c=>{
    const p = PR(c.propertyId); const t = P(c.tenantId);
    return `<tr class="clickable" data-nav="/propiedades/${p.id}?tab=contrato">
      <td class="cell-title tnum">${esc(numeroContrato(c))}</td>
      <td><div class="cell-title">${esc(p.direccion)}</div><div class="cell-sub">${esc(p.localidad)}</div></td>
      <td>${esc(nombreCompleto(t))}</td>
      <td class="num tnum">${money(c.alquilerActual)}</td>
      <td>${estadoBadge(c.estado)}</td>
      <td>${pendienteActualizacion(c)?`<span class="badge badge-warn">${icon('alert')}Actualización pendiente</span>`:'<span class="cell-sub">Al día</span>'}</td>
    </tr>`;
  }).join('');
  return `
    <div class="page-head">
      <div><h1 class="page-title">Contratos</h1><div class="page-sub">${list.length} contratos</div></div>
      <button class="btn btn-primary" data-action="nuevo-contrato">${icon('plus')}Nuevo contrato</button>
    </div>
    <div class="note-banner info" style="margin-bottom:16px;">${icon('bolt')}<div>Acá vinculás propietario, propiedad, inquilino, monto y periodicidad. Para aplicar aumentos por ICL, IPC o acuerdo, andá a <b>Cobranzas → Aumentos</b>.</div></div>
    <div style="display:flex; gap:14px; flex-wrap:wrap; align-items:center; margin-bottom:16px;">
      <div class="search-wrap" style="max-width:340px;">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input class="search-input" id="contratosFilterInput" placeholder="Buscar propiedad, inquilino, propietario..." value="${esc(query||'')}">
      </div>
      <div class="pill-row">${filters.map(([k,l])=>`<button class="pill ${filter===k?'active':''}" data-contratofilter="${k}">${l}</button>`).join('')}</div>
    </div>
    <div class="table-wrap">
      ${list.length? `<table><thead><tr><th>Contrato</th><th>Propiedad</th><th>Inquilino</th><th class="num">Alquiler</th><th>Estado</th><th>Actualización</th></tr></thead><tbody>${rows}</tbody></table>`
      : `<div class="empty-state">${icon('contratos')}<div class="empty-state-title">No hay contratos en este filtro</div></div>`}
    </div>`;
}

function nuevoContratoModal(){
  const disponibles = properties.filter(p=>p.estado==='Disponible');
  if(!disponibles.length){ showToast('No hay propiedades disponibles para armar un contrato nuevo'); return; }
  const opts = disponibles.map(p=>`<option value="${p.id}">${esc(p.direccion)} — ${esc(p.localidad)}</option>`).join('');
  showModal(`
    <div class="section-title" style="margin-bottom:4px;">Nuevo contrato</div>
    <div class="page-sub" style="margin-bottom:14px;">Completá los datos para dar de alta el contrato y la propiedad pasa a "Alquilada".</div>
    <div class="form-grid" style="margin-bottom:12px;">
      <div class="field" style="grid-column:1/-1;">
        <label>Propiedad</label>
        <select id="ncPropiedad">${opts}</select>
      </div>
      <div class="field"><label>Propietario</label><input id="ncPropietario" disabled></div>
      <div class="field"><label>N° de contrato</label><input id="ncNumero" placeholder="Número interno de la inmobiliaria"></div>
    </div>
    <div class="divider"></div>
    <div class="form-grid" style="margin-bottom:12px;">
      <div class="field"><label>Inquilino — nombre y apellido</label><input id="ncInq1Nombre" placeholder="Ej: Juan Fernández"></div>
      <div class="field"><label>Inquilino — teléfono</label><input id="ncInq1Tel" placeholder="11-2211-7765"></div>
      <div class="field"><label>Inquilino 2 (opcional)</label><input id="ncInq2Nombre" placeholder="Si figuran dos personas"></div>
      <div class="field"><label>Teléfono inquilino 2</label><input id="ncInq2Tel" placeholder="Opcional"></div>
      <div class="field"><label>Garante (opcional)</label><input id="ncGarNombre" placeholder="Nombre y apellido"></div>
      <div class="field"><label>Teléfono garante</label><input id="ncGarTel" placeholder="Opcional"></div>
    </div>
    <div class="divider"></div>
    <div class="form-grid" style="margin-bottom:12px;">
      <div class="field"><label>Valor de alquiler</label><input type="number" id="ncValor" step="500" placeholder="0"></div>
      <div class="field"><label>Depósito</label><input type="number" id="ncDeposito" step="500" placeholder="Igual al alquiler si se deja vacío"></div>
      <div class="field"><label>Tipo de aumento</label>
        <select id="ncTipoAumento">
          <option value="ICL">ICL</option>
          <option value="IPC">IPC</option>
          <option value="Fijo">Porcentaje fijo</option>
          <option value="Personalizado">Personalizado / acuerdo</option>
        </select>
      </div>
      <div class="field"><label>% fijo (solo si aplica)</label><input type="number" id="ncPctFijo" step="0.5" placeholder="Ej: 10"></div>
      <div class="field"><label>Periodicidad de aumento</label>
        <select id="ncFrecuencia"><option value="3">Cada 3 meses</option><option value="4">Cada 4 meses</option><option value="6">Cada 6 meses</option><option value="12">Cada 12 meses</option></select>
      </div>
      <div class="field"></div>
      <div class="field"><label>Fecha de inicio</label><input type="date" id="ncInicio" value="${TODAY_ISO}"></div>
      <div class="field"><label>Fecha de fin</label><input type="date" id="ncFin"></div>
    </div>
    <div class="divider"></div>
    <div style="display:flex; gap:24px; flex-wrap:wrap; margin-bottom:16px;">
      <label style="display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:600;"><input type="checkbox" id="ncPagaExpensas"> ¿Paga expensas?</label>
      <input type="number" id="ncExpensasMonto" placeholder="Monto expensas" style="max-width:160px; padding:8px 10px; border:1px solid var(--border-strong); border-radius:9px; background:var(--paper-50); color:var(--ink-900);">
      <label style="display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:600;"><input type="checkbox" id="ncPagaServicios"> ¿Paga servicios a reintegrar al propietario?</label>
    </div>
    <div class="divider"></div>
    <div style="margin-bottom:16px;">${honorariosFields(HONORARIOS_DEFAULT)}</div>
    <div style="display:flex; gap:10px; justify-content:flex-end;">
      <button class="btn" data-modal-cancel="1">Cancelar</button>
      <button class="btn btn-primary" id="ncSaveBtn">Crear contrato</button>
    </div>`, true);
  const propSel = document.getElementById('ncPropiedad');
  const updateOwner = ()=>{ document.getElementById('ncPropietario').value = nombreCompleto(P(PR(propSel.value).ownerId)); };
  propSel.addEventListener('change', updateOwner);
  updateOwner();
  bindHonorariosFields();
  document.getElementById('ncSaveBtn').onclick = ()=>{
    const propertyId = propSel.value;
    const valor = parseFloat(document.getElementById('ncValor').value)||0;
    const inq1Nombre = document.getElementById('ncInq1Nombre').value.trim();
    if(!propertyId || !inq1Nombre || valor<=0){ showToast('Completá al menos propiedad, inquilino y valor de alquiler'); return; }
    const numero = document.getElementById('ncNumero').value.trim();
    const honorarios = leerHonorarios(); if(!honorarios) return;
    if(numero && contracts.some(x=>x.numero===numero)){ showToast('Ya existe un contrato con el N° '+numero); return; }
    const crearPersona = (nombreTxt, telefono, rol)=>{
      const partes = nombreTxt.split(' ');
      const p = {id:'PS'+Date.now()+Math.floor(Math.random()*1000), nombre:partes[0], apellido:partes.slice(1).join(' ')||'—', dni:'—', telefono:telefono||'—', email:'—', roles:[rol]};
      persons.push(p);
      return p.id;
    };
    const tenantId = crearPersona(inq1Nombre, document.getElementById('ncInq1Tel').value.trim(), 'Inquilino');
    const inq2Nombre = document.getElementById('ncInq2Nombre').value.trim();
    const tenantId2 = inq2Nombre ? crearPersona(inq2Nombre, document.getElementById('ncInq2Tel').value.trim(), 'Inquilino') : null;

function numeroALetras(n){
  n = Math.round(n);
  if(n===0) return 'cero';
  const UNIDADES=['','un','dos','tres','cuatro','cinco','seis','siete','ocho','nueve'];
  const DIECI=['diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve'];
  const DECENAS=['','','veinte','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
  const CENTENAS=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
  function tres(n){
    if(n===0) return '';
    if(n===100) return 'cien';
    let out=''; const c=Math.floor(n/100), r=n%100;
    if(c>0) out+=CENTENAS[c]+' ';
    if(r>0){
      if(r<10) out+=UNIDADES[r];
      else if(r<20) out+=DIECI[r-10];
      else { const d=Math.floor(r/10), u=r%10; if(d===2&&u>0) out+='veinti'+UNIDADES[u]; else { out+=DECENAS[d]; if(u>0) out+=' y '+UNIDADES[u]; } }
    }
    return out.trim();
  }
  let out=''; const millones=Math.floor(n/1000000); n%=1000000; const miles=Math.floor(n/1000); const resto=n%1000;
  if(millones>0) out += (millones===1?'un millón':tres(millones)+' millones')+' ';
  if(miles>0) out += (miles===1?'mil':tres(miles)+' mil')+' ';
  if(resto>0) out += tres(resto);
  return out.trim();
}

// vuelve el pago exactamente a como estaba (incluye borrar campos que no existían antes)
function restaurarPago(p, prev){
  Object.keys(p).forEach(k=>{ if(!(k in prev)) delete p[k]; });
  Object.assign(p, prev);
}
function cobrarModal(pid){
  const p = payments.find(x=>x.id===pid);
  const c = CT(p.contractId); const prop = PR(c.propertyId); const t = P(c.tenantId);
  const pagadoYa = p.estado==='Parcial' ? (p.pagado||0) : 0;
  const inputStyle = 'text-align:right;';
  showModal(`
    <div class="section-title" style="margin-bottom:10px;">Registrar cobro</div>
    <div class="page-sub" style="margin-bottom:14px;">${esc(prop.direccion)} — ${esc(nombreCompleto(t))} — ${periodoLabel(p.periodo)}</div>
    <div class="form-grid" style="margin-bottom:12px;">
      <div class="field"><label>Alquiler</label><input type="number" value="${p.importe}" disabled style="${inputStyle}"></div>

        <label style="display:flex; gap:6px; align-items:center; text-transform:none; letter-spacing:0; font-weight:600; color:var(--ink-600); font-size:12.5px;"><input type="checkbox" id="cobroExpensasLiq" ${p.expensasLiq===false?'':'checked'}> Sumar a la liquidación del propietario</label></div>
      <div class="field"><label>Servicios</label><input type="number" id="cobroServicios" min="0" step="100" value="${p.servicios||0}" style="${inputStyle}">
        <label style="display:flex; gap:6px; align-items:center; text-transform:none; letter-spacing:0; font-weight:600; color:var(--ink-600); font-size:12.5px;"><input type="checkbox" id="cobroServiciosLiq" ${p.serviciosLiq===false?'':'checked'}> Sumar a la liquidación del propietario</label></div>
      <div class="field"><label>Total del período</label><input type="text" id="cobroTotal" disabled style="${inputStyle} font-weight:700;"></div>
    </div>
    <div class="page-sub" style="margin-bottom:14px;">Expensas y servicios son opcionales: dejalos en 0 si no corresponden este mes. Siempre van en el recibo; destildá "Sumar a la liquidación" cuando esa plata no le corresponde al propietario.</div>
    <div class="field" style="margin-bottom:16px;">
      <label id="cobroMontoLabel">Monto cobrado ahora</label>
      <input type="number" id="cobroMonto" style="${inputStyle}">
    </div>
    <div style="display:flex; gap:10px; justify-content:flex-end;">
      <button class="btn" data-modal-cancel="1">Cancelar</button>
      <button class="btn btn-primary" id="cobroConfirmBtn">Confirmar cobro</button>
    </div>`, true);
  const leer = id => Math.max(0, parseFloat(document.getElementById(id).value)||0);
  const totalActual = () => p.importe + leer('cobroExpensas') + leer('cobroServicios');
  const refrescar = ()=>{
    const total = totalActual(); const saldo = Math.max(0, total - pagadoYa);
    document.getElementById('cobroTotal').value = money(total);
    document.getElementById('cobroMontoLabel').textContent = `Monto cobrado ahora (saldo pendiente: ${money(saldo)}${pagadoYa?' — ya pagó '+money(pagadoYa):''})`;
    document.getElementById('cobroMonto').value = saldo;
  };
  ['cobroExpensas','cobroServicios'].forEach(id=>document.getElementById(id).addEventListener('input', refrescar));
  refrescar();
  document.getElementById('cobroConfirmBtn').onclick = ()=>{
    const monto = parseFloat(document.getElementById('cobroMonto').value)||0;
    if(monto<=0){ showToast('Ingresá un monto válido'); return; }
    const prev = {...p};
    const expensas = leer('cobroExpensas'), servicios = leer('cobroServicios');
    if(expensas) p.expensas = expensas; else delete p.expensas;
    if(servicios) p.servicios = servicios; else delete p.servicios;
    if(expensas && !document.getElementById('cobroExpensasLiq').checked) p.expensasLiq = false; else delete p.expensasLiq;
    if(servicios && !document.getElementById('cobroServiciosLiq').checked) p.serviciosLiq = false; else delete p.serviciosLiq;
    const nuevoPagado = pagadoYa + monto;
    const total = pagoTotal(p);
    const deshacer = ()=>{ restaurarPago(p, prev); route(); showToast('Pago deshecho'); };
    closeModal();
    if(nuevoPagado >= total){
      p.estado='Pagado'; p.fechaPago=TODAY_ISO; delete p.pagado;
      showToast('Pago completo registrado', deshacer);
      route();
      verRecibo(pid);
    } else {
      p.estado='Parcial'; p.pagado=nuevoPagado; p.fechaPago=TODAY_ISO;
      showToast(`Pago parcial registrado — quedan pendientes ${money(total-nuevoPagado)}`, deshacer);
      route();
    }
  };
}
function deshacerPago(pid){
  const pg = payments.find(x=>x.id===pid);
  const prev = {...pg};
  pg.estado='Pendiente'; pg.fechaPago=null; delete pg.pagado;
  showToast('Pago revertido a pendiente', ()=>{ restaurarPago(pg, prev); route(); showToast('Se restauró el pago'); });
  route();
}

function computeNuevo(c){
  if(c.tipoAumento==='ICL') return roundTo500(c.alquilerActual*(1+INDICES.ICL/100));
  if(c.tipoAumento==='IPC') return roundTo500(c.alquilerActual*(1+INDICES.IPC/100));
  if(c.tipoAumento==='Fijo') return roundTo500(c.alquilerActual*(1+c.pctFijo/100));
  return c.alquilerActual;
}
function aplicarActualizacion(c, nuevo, indiceLabel){
  c.historial.push({fecha:TODAY_ISO, anterior:c.alquilerActual, nuevo, indice:indiceLabel});
  c.alquilerActual = nuevo;
  c.proxAct = addMonths(c.proxAct, c.frecuencia);
}
function deshacerActualizacion(c, prev){
  c.historial.pop();
  c.alquilerActual = prev.alquilerActual;
  c.proxAct = prev.proxAct;
  route();
  showToast('Actualización deshecha');
}
function actualizarContratoDesdeUI(cid){
  const c = CT(cid);
  const input = document.getElementById('nuevoAlquiler_'+cid);
  const nuevo = roundTo500(parseFloat(input.value)||c.alquilerActual);
  const auto = c.tipoAumento!=='Personalizado' && nuevo===computeNuevo(c);
  const indiceLabel = c.tipoAumento==='Personalizado' ? 'Acuerdo entre partes' : (auto ? `${c.tipoAumento} ${c.tipoAumento==='Fijo'?c.pctFijo:INDICES[c.tipoAumento]}%` : 'Ajuste manual');
  const prev = {alquilerActual:c.alquilerActual, proxAct:c.proxAct};
  aplicarActualizacion(c, nuevo, indiceLabel);
  showToast('Contrato N° '+numeroContrato(c)+' actualizado — nuevo alquiler '+money(nuevo), ()=>deshacerActualizacion(c, prev));
  route();
}
function actualizarTodosPendientes(){
  const due = contracts.filter(pendienteActualizacion).filter(c=>c.tipoAumento!=='Personalizado');
  if(!due.length){ showToast('No hay contratos automáticos pendientes de actualizar'); return; }
  showConfirm(`¿Actualizar ${due.length} contrato${due.length>1?'s':''} pendiente${due.length>1?'s':''} por ICL/IPC/% fijo? Los contratos "Personalizado" no se tocan. Después vas a poder deshacerlo.`, ()=>{
    const snapshots = due.map(c=>({c, prev:{alquilerActual:c.alquilerActual, proxAct:c.proxAct}}));
    due.forEach(c=> aplicarActualizacion(c, computeNuevo(c), `${c.tipoAumento} ${c.tipoAumento==='Fijo'?c.pctFijo:INDICES[c.tipoAumento]}%`));
    showToast(`${due.length} contrato${due.length>1?'s':''} actualizado${due.length>1?'s':''}`, ()=>{
      snapshots.forEach(({c,prev})=>{ c.historial.pop(); c.alquilerActual=prev.alquilerActual; c.proxAct=prev.proxAct; });
      route();
      showToast('Actualización masiva deshecha');
    });
    route();
  });
}

// acciones según la etapa: Pendiente/En curso → Arreglado → Pagado (pasa al historial)
function arregloAcciones(r){
  const editar = `<button class="btn btn-sm btn-ghost" data-editar-arreglo="${r.id}">Editar</button>`;
  if(r.estado==='Pendiente' || r.estado==='En curso') return `<button class="btn btn-sm" data-arreglo-etapa="${r.id}:Arreglado">Marcar arreglado</button>${editar}`;
  if(r.estado==='Arreglado') return `<button class="btn btn-sm btn-primary" data-arreglo-etapa="${r.id}:Pagado">Marcar pagado</button>${editar}`;
  return editar;
}
function cambiarEtapaArreglo(id, etapa){
  const r = repairs.find(x=>x.id===id); if(!r) return;
  if(etapa==='Arreglado' && (r.costo==null || !r.pagadoPor)){
    showToast('Antes de marcarlo arreglado, cargá el costo final y quién lo paga');
    arregloModal(r.propertyId, r.id, 'Arreglado');
    return;
  }
  const prev = {...r};
  r.estado = etapa;
  if(etapa==='Arreglado'){ r.fechaResuelto = TODAY_ISO; r.fechaPagado = null; }
  if(etapa==='Pagado'){ r.fechaPagado = TODAY_ISO; if(!r.fechaResuelto) r.fechaResuelto = TODAY_ISO; }
  const msg = etapa==='Pagado' ? 'Arreglo pagado — queda en el historial de la propiedad' : (r.pagadoPor==='Propietario' ? 'Arreglado — se descuenta en la liquidación del propietario' : 'Arreglado — falta registrar el pago');
  showToast(msg, ()=>{ Object.keys(r).forEach(k=>{ if(!(k in prev)) delete r[k]; }); Object.assign(r, prev); route(); showToast('Cambio deshecho'); });
  route();
}
function arregloModal(propertyId, repairId, estadoForzado){

      <div class="field"><label>Etapa</label><select id="naEstado">${ARREGLO_ESTADOS.map(e=>`<option ${e===estadoSel?'selected':''}>${e}</option>`).join('')}</select></div>
      <div class="field"><label>Especialista</label><input id="naEsp" placeholder="Opcional — Ej: Plomería Ríos" value="${esc(r&&r.especialista||'')}"></div>

      <div class="field"><label>Lo paga</label><select id="naPaga"><option value="">A definir</option>${['Propietario','Inquilino'].map(o=>`<option ${r&&r.pagadoPor===o?'selected':''}>${o}</option>`).join('')}</select></div>
      <div class="field"></div>

    <div style="display:flex; gap:10px; justify-content:flex-end;">
      <button class="btn" data-modal-cancel="1">Cancelar</button>
      <button class="btn btn-primary" id="naSaveBtn">${r?'Guardar cambios':'Guardar arreglo'}</button>
    </div>`, true);
  document.getElementById('naSaveBtn').onclick = ()=>{
    const val = id => document.getElementById(id).value.trim();
    if(!val('naDesc')){ showToast('Describí el arreglo'); return; }
    const costo = val('naCosto') ? Math.max(0, parseFloat(val('naCosto'))||0) : null;
    const estado = val('naEstado'), pagadoPor = val('naPaga')||null;
    if((estado==='Arreglado' || estado==='Pagado') && (costo==null || !pagadoPor)){ showToast('Para "'+estado+'" cargá el costo y quién lo paga'); return; }
    const datos = {propertyId:val('naProp'), descripcion:val('naDesc'), fechaAviso:val('naFecha')||TODAY_ISO, especialista:val('naEsp')||null,
      estado, costo, pagadoPor, urgente:document.getElementById('naUrgente').checked, obs:val('naObs')};
    const base = r || {};
    datos.fechaResuelto = (estado==='Arreglado' || estado==='Pagado') ? (base.fechaResuelto || TODAY_ISO) : null;
    datos.fechaPagado = estado==='Pagado' ? (base.fechaPagado || TODAY_ISO) : null;
    closeModal();
    if(r){
      const prev = {...r};
      Object.assign(r, datos);
      showToast('Arreglo actualizado', ()=>{ Object.assign(r, prev); route(); showToast('Cambio deshecho'); });
    } else {
      repairs.push({id:'AR'+Date.now(), ...datos, documentos:[]});
      showToast('Arreglo registrado');
    }
    route();
  };
}

        <div class="liq-line"><span>Subtotal cobrado</span><span class="tnum">${money(l.cobrado)}</span></div>
        ${l.detalle.map(d=>`<div class="liq-line"><span>Honorarios — ${esc(d.property.direccion)} (${honorariosLabel(d.contract)})</span><span class="tnum">- ${money(d.honorarios)}</span></div>`).join('')}
        ${l.gastos.map(g=>`<div class="liq-line"><span>${esc(g.desc)}</span><span class="tnum">- ${money(g.monto)}</span></div>`).join('')}
        <div class="liq-line"><span>Total a liquidar</span><span class="tnum">${money(l.total)}</span></div>
        <button class="btn btn-sm" style="margin-top:10px;" onclick="imprimirLiquidacion('${l.ownerId}')">${icon('printer')}Imprimir liquidación</button>` : ''}
      </div>
    </div>`).join('');
  return `
    <div class="page-head"><div><h1 class="page-title">Liquidaciones</h1><div class="page-sub">${periodoLabel(PERIODO_ACTUAL)}</div></div><button class="btn" onclick="imprimirTodasLiquidaciones()">${icon('printer')}Imprimir todas</button></div>
    <div class="search-wrap" style="max-width:340px; margin-bottom:16px;">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input class="search-input" id="liquidacionesFilterInput" placeholder="Buscar propietario..." value="${esc(query||'')}">
    </div>
    ${liqs.length? `<div class="card">${rows}</div>` : `<div class="empty-state">${icon('check')}<div class="empty-state-title">No encontramos propietarios</div></div>`}`;
}

/* ============================== ROUTER ============================== */
function parseHash(){
  let h = location.hash.slice(1) || '/dashboard';
  const [path, qs] = h.split('?');
  const parts = path.split('/').filter(Boolean);
  const params = new URLSearchParams(qs||'');
  return {parts, params};
}
function route(){
  const activeEl = document.activeElement;
  const activeId = activeEl && activeEl.id;
  const selStart = activeEl && typeof activeEl.selectionStart==='number' ? activeEl.selectionStart : null;
  const {parts, params} = parseHash();
  const section = parts[0] || 'dashboard';
  let html = '';
  if(section==='dashboard') html = viewDashboard();
  else if(section==='propiedades'){
    if(parts[1]) html = viewFichaPropiedad(parts[1], params.get('tab'));
    else html = viewPropiedades(params.get('filter'), params.get('q'));
  }
  else if(section==='personas') html = viewPersonas(params.get('q'));
  else if(section==='contratos') html = viewContratos(params.get('filter'), params.get('q'));
  else if(section==='cobranzas') html = viewCobranzas(params.get('sub'), params.get('q'));
  else if(section==='deudores') html = viewDeudores(params.get('filter'), params.get('q'));
  else if(section==='arreglos') html = viewArreglos(params.get('filter'), params.get('q'));
  else if(section==='servicios') html = viewServicios();
  else if(section==='liquidaciones') html = viewLiquidaciones(params.get('q'));
  else if(section==='configuracion') html = viewConfiguracion();
  else html = viewDashboard();

  document.getElementById('view').innerHTML = html;
  renderNav(section);
  document.getElementById('todayPill').textContent = HOY.toLocaleDateString('es-AR',{day:'numeric',month:'long',year:'numeric'});
  document.body.classList.remove('sidebar-open');
  if(activeId){
    const el = document.getElementById(activeId);
    if(el && el.focus){
      el.focus({preventScroll:true});
      if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selStart); }catch(e){} }
    } else {
      window.scrollTo(0,0);
    }
  } else {
    window.scrollTo(0,0);
  }
}
window.addEventListener('hashchange', route);

/* ============================== EVENTS ============================== */
document.addEventListener('click', (e)=>{
  // acciones específicas primero: pueden estar anidadas dentro de una fila clickeable (data-nav)
  const cobrarEl = e.target.closest('[data-cobrar]');
  if(cobrarEl){ cobrarModal(cobrarEl.getAttribute('data-cobrar')); return; }

  const reciboEl = e.target.closest('[data-ver-recibo]');
  if(reciboEl){ verRecibo(reciboEl.getAttribute('data-ver-recibo')); return; }

  const deshacerPagoEl = e.target.closest('[data-deshacer-pago]');
  if(deshacerPagoEl){ deshacerPago(deshacerPagoEl.getAttribute('data-deshacer-pago')); return; }

  const etapaEl = e.target.closest('[data-arreglo-etapa]');
  if(etapaEl){ const [id, etapa] = etapaEl.getAttribute('data-arreglo-etapa').split(':'); cambiarEtapaArreglo(id, etapa); return; }
  const linkNav = e.target.closest('a[data-nav]');
  if(linkNav && linkNav.closest('[data-editar-arreglo]')){ location.hash = '#'+linkNav.getAttribute('data-nav'); return; }
  const editArr = e.target.closest('[data-editar-arreglo]');
  if(editArr){ const r = repairs.find(x=>x.id===editArr.getAttribute('data-editar-arreglo')); if(r) arregloModal(r.propertyId, r.id); return; }
  const actEl0 = e.target.closest('[data-actualizar]');
  if(actEl0){ actualizarContratoDesdeUI(actEl0.getAttribute('data-actualizar')); return; }

  const guardarIdx0 = e.target.closest('[data-action="guardar-indices"]');
  if(guardarIdx0){
    INDICES.ICL = parseFloat(document.getElementById('indiceIcl').value)||0;
    INDICES.IPC = parseFloat(document.getElementById('indiceIpc').value)||0;
    showToast('Índices guardados');
    route();
    return;
  }
  const actTodos0 = e.target.closest('[data-action="actualizar-todos"]');
  if(actTodos0){ actualizarTodosPendientes(); return; }

  const nuevoSvc = e.target.closest('[data-action="nuevo-servicio-pagado"]');
  if(nuevoSvc){ nuevoServicioPagadoModal(); return; }

  const nuevaDeuda = e.target.closest('[data-action="nueva-deuda-servicio"]');
  if(nuevaDeuda){ nuevaDeudaServicioModal(); return; }

  const elimDeuda = e.target.closest('[data-eliminar-deuda-servicio]');
  if(elimDeuda){
    const id = elimDeuda.getAttribute('data-eliminar-deuda-servicio');
    const idx = deudasServicios.findIndex(x=>x.id===id);
    if(idx>-1){
      const removed = deudasServicios[idx];
      deudasServicios.splice(idx,1);
      showToast('Deuda de servicio regularizada', ()=>{ deudasServicios.splice(idx,0,removed); route(); showToast('Deuda restaurada'); });
      route();
    }
    return;
  }

  const garanteEl = e.target.closest('[data-agregar-garante]');
  if(garanteEl){ agregarGaranteModal(garanteEl.getAttribute('data-agregar-garante')); return; }

  const deudorFilterEl = e.target.closest('[data-deudorfilter]');
  if(deudorFilterEl){ const {params:pd} = parseHash(); location.hash = `#/deudores?filter=${deudorFilterEl.getAttribute('data-deudorfilter')}${pd.get('q')?'&q='+encodeURIComponent(pd.get('q')):''}`; return; }

  const nuevaDeudaContratoEl = e.target.closest('[data-nueva-deuda-contrato]');
  if(nuevaDeudaContratoEl){ nuevaDeudaServicioModal(nuevaDeudaContratoEl.getAttribute('data-nueva-deuda-contrato')); return; }

  const nuevoContratoEl = e.target.closest('[data-action="nuevo-contrato"]');
  if(nuevoContratoEl){ nuevoContratoModal(); return; }

  const modalCancel = e.target.closest('[data-modal-cancel]');
  if(modalCancel){ closeModal(); return; }
  if(e.target.id==='modalOverlay'){ closeModal(); return; }

  const toastUndoEl = e.target.closest('[data-toast-undo]');
  if(toastUndoEl){
    const t = document.getElementById('toast');
    if(t._undo) t._undo();
    t.classList.remove('show');
    return;
  }

  const navEl = e.target.closest('[data-nav]');
  if(navEl){ e.preventDefault(); location.hash = '#'+navEl.getAttribute('data-nav'); if(navEl.hasAttribute('data-close-drawer')) closeDrawer(); return; }

  const tabEl = e.target.closest('[data-ficha-tab]');
  if(tabEl){ const [pid,tab] = tabEl.getAttribute('data-ficha-tab').split(':'); location.hash = `#/propiedades/${pid}?tab=${tab}`; return; }

  const pillProp = e.target.closest('[data-propfilter]');
  if(pillProp){ const f = pillProp.getAttribute('data-propfilter'); const {params} = parseHash(); location.hash = `#/propiedades?filter=${f}${params.get('q')?'&q='+encodeURIComponent(params.get('q')):''}`; return; }

  const pillContrato = e.target.closest('[data-contratofilter]');
  if(pillContrato){ const {params:pc} = parseHash(); location.hash = `#/contratos?filter=${pillContrato.getAttribute('data-contratofilter')}${pc.get('q')?'&q='+encodeURIComponent(pc.get('q')):''}`; return; }

  const pillArreglo = e.target.closest('[data-arreglofilter]');
  if(pillArreglo){ const {params:pa} = parseHash(); location.hash = `#/arreglos?filter=${pillArreglo.getAttribute('data-arreglofilter')}${pa.get('q')?'&q='+encodeURIComponent(pa.get('q')):''}`; return; }

  const pillCobSub = e.target.closest('[data-cobranzasub]');
  if(pillCobSub){ location.hash = `#/cobranzas?sub=${pillCobSub.getAttribute('data-cobranzasub')}`; return; }

  const personaEl = e.target.closest('[data-persona]');
  if(personaEl){ openDrawer(personaDrawer(personaEl.getAttribute('data-persona'))); return; }

  const liqToggle = e.target.closest('[data-liq-toggle]');
  if(liqToggle){ document.getElementById('liqRow'+liqToggle.getAttribute('data-liq-toggle')).classList.toggle('open'); return; }

  if(e.target.closest('#drawerCloseBtn') || e.target===document.getElementById('drawerOverlay')){ closeDrawer(); return; }
});

document.addEventListener('input', (e)=>{
  const id = e.target.id;
  if(id==='propFilterInput'){ const {params} = parseHash(); location.hash = `#/propiedades?filter=${params.get('filter')||'todos'}&q=${encodeURIComponent(e.target.value)}`; }
  else if(id==='personaFilterInput'){ location.hash = `#/personas?q=${encodeURIComponent(e.target.value)}`; }
  else if(id==='contratosFilterInput'){ const {params} = parseHash(); location.hash = `#/contratos?filter=${params.get('filter')||'activos'}&q=${encodeURIComponent(e.target.value)}`; }
  else if(id==='arreglosFilterInput'){ const {params} = parseHash(); location.hash = `#/arreglos?filter=${params.get('filter')||'todos'}&q=${encodeURIComponent(e.target.value)}`; }
  else if(id==='deudoresFilterInput'){ const {params} = parseHash(); location.hash = `#/deudores?filter=${params.get('filter')||'todos'}&q=${encodeURIComponent(e.target.value)}`; }
  else if(id==='liquidacionesFilterInput'){ location.hash = `#/liquidaciones?q=${encodeURIComponent(e.target.value)}`; }
  else if(id==='cobranzasFilterInput'){ const {params} = parseHash(); location.hash = `#/cobranzas?sub=mes&q=${encodeURIComponent(e.target.value)}`; }
});

/* global search */
const searchInput = document.getElementById('globalSearch');
const searchResults = document.getElementById('searchResults');
searchInput.addEventListener('input', ()=>{
  const q = searchInput.value.trim().toLowerCase();
  if(!q){ searchResults.classList.remove('show'); return; }
  const props = properties.filter(p=> (p.id+' '+p.direccion+' '+p.localidad+' '+p.tipo+' '+nombreCompleto(P(p.ownerId))+' '+nombreCompleto(P(p.tenantId))).toLowerCase().includes(q)).slice(0,5);
  const ppl = persons.filter(p=> (nombreCompleto(p)+' '+p.dni).toLowerCase().includes(q)).slice(0,5);
  if(!props.length && !ppl.length){ searchResults.innerHTML = `<div class="search-empty">Sin resultados para "${esc(searchInput.value)}"</div>`; searchResults.classList.add('show'); return; }
  searchResults.innerHTML = `
    ${props.length?`<div class="search-group-label">Propiedades</div>${props.map(p=>`<div class="search-result" data-nav="/propiedades/${p.id}"><div class="search-result-title">${esc(p.direccion)}</div><div class="search-result-sub">${esc(p.tipo)} · ${esc(p.localidad)} · ${estadoTxt(p.estado)}</div></div>`).join('')}`:''}
    ${ppl.length?`<div class="search-group-label">Personas</div>${ppl.map(p=>`<div class="search-result" data-persona="${p.id}">${esc(nombreCompleto(p))}<div class="search-result-sub">${p.roles.join(' · ')}</div></div>`).join('')}`:''}
  `;
  searchResults.classList.add('show');
});
function estadoTxt(s){return s;}
searchResults.addEventListener('click', (e)=>{
  const navEl = e.target.closest('[data-nav]');
  if(navEl){ location.hash = '#'+navEl.getAttribute('data-nav'); searchResults.classList.remove('show'); searchInput.value=''; return; }
  const personaEl = e.target.closest('[data-persona]');
  if(personaEl){ openDrawer(personaDrawer(personaEl.getAttribute('data-persona'))); searchResults.classList.remove('show'); searchInput.value=''; }
});
document.addEventListener('click', (e)=>{ if(!e.target.closest('.search-wrap')) searchResults.classList.remove('show'); });
searchInput.addEventListener('keydown', (e)=>{ if(e.key==='Escape'){ searchResults.classList.remove('show'); searchInput.blur(); } });

/* drawer */
function openDrawer(html){ document.getElementById('drawer').innerHTML = html; document.getElementById('drawerOverlay').classList.add('show'); }
function closeDrawer(){ document.getElementById('drawerOverlay').classList.remove('show'); }

/* mobile nav */
document.getElementById('hamburgerBtn').addEventListener('click', ()=>document.body.classList.add('sidebar-open'));
document.getElementById('navOverlay').addEventListener('click', ()=>document.body.classList.remove('sidebar-open'));
document.getElementById('backBtn').addEventListener('click', ()=>history.back());

route();
</script>
