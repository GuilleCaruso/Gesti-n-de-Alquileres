# Pruebas y publicación automática en Firebase.
# - Propuesta de cambio (pull request): corre las pruebas y publica la vista previa y las reglas en el proyecto
#   de PRUEBAS (caruso-pruebas, datos de mentira). No toca la base real.
# - Cambio aprobado en main: corre las pruebas y publica la app y las reglas en el proyecto real (caruso-propiedades).
# Secretos: FIREBASE_SERVICE_ACCOUNT (real) y FIREBASE_SERVICE_ACCOUNT_PRUEBAS (pruebas).
name: Pruebas y publicación

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pruebas-y-publicacion:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    env:
      HAY_CREDENCIAL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
      HAY_PRUEBAS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRUEBAS != '' }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Pruebas de reglas de negocio
        run: npm test
      - name: Pruebas de seguridad (reglas de Firestore)
        run: npm run test:rules
      - name: Prueba de punta a punta (ingreso y usuarios)
        run: |
          npx playwright install --with-deps chromium
          SHOTS=/tmp npm run test:e2e
      # Pull request: se compila contra el proyecto de pruebas (caruso-pruebas, datos de mentira).
      # main: se compila contra el proyecto real (caruso-propiedades).
      - name: Compilar
        env:
          VITE_ENTORNO: ${{ github.event_name == 'pull_request' && 'pruebas' || 'produccion' }}
        run: npm run build

      # ---------- pull request → proyecto de pruebas ----------
      - name: Reglas de seguridad (pruebas)
        if: github.event_name == 'pull_request' && env.HAY_PRUEBAS == 'true'
        env:
          CREDENCIAL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRUEBAS }}
        run: |
          printf '%s' "$CREDENCIAL" > "$RUNNER_TEMP/sa.json"
          trap 'rm -f "$RUNNER_TEMP/sa.json"' EXIT
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx firebase deploy --only firestore --project caruso-pruebas --non-interactive

      - name: Vista previa (pruebas)
        if: github.event_name == 'pull_request' && env.HAY_PRUEBAS == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRUEBAS }}
          projectId: caruso-pruebas
          expires: 14d

      - name: Falta la credencial de pruebas
        if: github.event_name == 'pull_request' && env.HAY_PRUEBAS != 'true'
        run: echo "::warning::Falta el secreto FIREBASE_SERVICE_ACCOUNT_PRUEBAS, no se publica la vista previa."

      # ---------- main → proyecto real ----------
      - name: Reglas de seguridad (real)
        if: github.event_name == 'push' && env.HAY_CREDENCIAL == 'true'
        env:
          CREDENCIAL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$CREDENCIAL" > "$RUNNER_TEMP/sa.json"
          trap 'rm -f "$RUNNER_TEMP/sa.json"' EXIT
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx firebase deploy --only firestore --project caruso-propiedades --non-interactive

      - name: Publicar app (real)
        if: github.event_name == 'push' && env.HAY_CREDENCIAL == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: caruso-propiedades
          channelId: live
